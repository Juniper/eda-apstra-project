# roles/create_sz/tasks/main.yml
---
- name: print blurprint_name
  debug:
    msg: "{{ blueprint_name }}"

- name: Fix escaped quotes and add missing commas for any number of parameters
  set_fact:
    # Step 1: Replace escaped quotes with normal quotes
    vrf_cleaned_string: "{{ annotations['apstra.juniper.net/vrf'] | regex_replace('\\\\\"', '\"') }}"

- name: Add missing commas between key-value pairs
  set_fact:
    # Step 2: Ensure commas between key-value pairs by adding commas between consecutive strings if missing
    vrf_cleaned_comma_string: "{{ vrf_cleaned_string | regex_replace('\"([a-zA-Z_0-9]+)\": \"([^\"]+)\" \"([a-zA-Z_0-9]+)\":', '\"\\1\": \"\\2\", \"\\3\":') }}"

- name: Convert cleaned VRF string to JSON
  set_fact:
    # Step 3: Convert the cleaned and correctly formatted string to a dictionary
    vrf_data: "{{ vrf_cleaned_comma_string[0] }}"

- name: Extract label directly using regex
  debug:
    msg: "{{ vrf_data }}"

- name: Form the body combining sz_type
  ansible.builtin.set_fact:
    vrf_data_with_sztype: >-
      {{
        vrf_data
        | combine({'sz_type': (vrf_data.sz_type if vrf_data.sz_type is defined else "evpn" )})
        | combine({'label': (vrf_data.label if vrf_data.label is defined else vrf_data.vrfName)})
        | combine({'vrf_name': (vrf_data.vrfName if vrf_data.vrfName is defined else vrf_data.label)})
      }}

- name: Set VNI pool name from annotation if defined
  ansible.builtin.set_fact:
    vni_pool_name: "{{ vrf_data.vniPoolName | default('') }}"

- name: Set loopback pool name from annotation if defined
  ansible.builtin.set_fact:
    loopback_pool_name: "{{ vrf_data.loopbackPoolName | default('') }}"

- name: Debug - print pool names resolved from annotation
  debug:
    msg: "vni_pool_name='{{ vni_pool_name }}' loopback_pool_name='{{ loopback_pool_name }}' vrf_data={{ vrf_data }}"

- name: Print vrf_data_with_sztype
  debug:
    msg: "{{ vrf_data_with_sztype }}"

- name: Set the blueprint name
  set_fact:
    bluprint_label_value: "{{ blueprint_name }}"

- name: Extract tags from the annotations if present
  set_fact:
    sz_tags: "{{ annotations['apstra.juniper.net/vrf'] | regex_search('\"tags\": \"([^\"]+)\"', '\\1') }}"
  when: annotations['apstra.juniper.net/vrf'] is defined and 'tags' in annotations['apstra.juniper.net/vrf']

- name: Set sz_tags to None if tags are not present
  set_fact:
    sz_tags: ["k8s_ns={{ event.resource.metadata.name }}","source=eda", "cluster_name=ocpapstra-lab.englab.juniper.net"]
  when: annotations['apstra.juniper.net/vrf'] is not defined or 'tags' not in annotations['apstra.juniper.net/vrf']

- name: Connect to Apstra
  juniper.apstra.authenticate:
    verify_certificates: false
    logout: false
  register: auth

- block:
    - name: Get blueprint
      juniper.apstra.blueprint:
        body:
          label: "{{ bluprint_label_value }}"
        auth_token: "{{ auth.token }}"
        lock_state: "ignore"
      register: register_bp

    - name: Create tags if sz_tags is defined and is a list
      juniper.apstra.tag:
        id: "{{ register_bp.id }}"
        body:
          label: "{{ tag }}"
          description: "test tag description"
        auth_token: "{{ auth.token }}"
      when: sz_tags is defined and sz_tags | length > 0
      loop: "{{ sz_tags }}"
      loop_control:
        loop_var: tag

    - name: Create security_zone
      juniper.apstra.security_zone:
        id: "{{ register_bp.id }}"
        body: "{{ vrf_data_with_sztype }}"
        auth_token: "{{ auth.token }}"
        tags: "{{ sz_tags if sz_tags is not none else omit }}"
      register: sz

    - name: Gather VNI pools, IP pools and blueprint resource groups from Apstra
      juniper.apstra.apstra_facts:
        id: "{{ register_bp.id }}"
        auth_token: "{{ auth.token }}"
        gather_network_facts:
          - blueprints.resource_groups
          - vni_pools
          - ip_pools
      when: vni_pool_name | length > 0 or loopback_pool_name | length > 0

    - name: Debug - show all VNI pools
      debug:
        msg: "{{ ansible_facts.apstra_facts.vni_pools | dict2items | map(attribute='value') | map(attribute='display_name') | list }}"
      when: vni_pool_name | length > 0

    - name: Find VNI pool ID by display_name
      ansible.builtin.set_fact:
        vni_pool_id: >-
          {{
            ansible_facts.apstra_facts.vni_pools
            | dict2items
            | selectattr('value.display_name', 'equalto', vni_pool_name)
            | map(attribute='key')
            | first
            | default('')
          }}
      when: vni_pool_name | length > 0

    - name: Get all resource groups from blueprint via raw API
      ansible.builtin.uri:
        url: "{{ lookup('env', 'APSTRA_API_URL') }}/blueprints/{{ register_bp.id.blueprint }}/resource_groups"
        method: GET
        headers:
          AuthToken: "{{ auth.token }}"
        validate_certs: false
        status_code: 200
      register: rg_response
      when: vni_pool_name | length > 0 or loopback_pool_name | length > 0

    - name: Assign VNI pool to evpn_l3_vnis resource group
      ansible.builtin.uri:
        url: "{{ lookup('env', 'APSTRA_API_URL') }}/blueprints/{{ register_bp.id.blueprint }}/resource_groups/vni/evpn_l3_vnis"
        method: PUT
        headers:
          AuthToken: "{{ auth.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          pool_ids:
            - "{{ vni_pool_id }}"
        validate_certs: false
        status_code: [200, 202, 204]
      when: vni_pool_name | length > 0 and vni_pool_id | length > 0
      register: vni_assignment

    - name: Print VNI pool assignment result
      debug:
        msg: "VNI pool '{{ vni_pool_name }}' (id={{ vni_pool_id }}) assigned to evpn_l3_vnis"
      when: vni_pool_name | length > 0 and vni_pool_id | length > 0

    # ── Loopback IP pool assignment ───────────────────────────────────────
    - name: Find loopback IP pool ID by display_name
      ansible.builtin.set_fact:
        loopback_pool_id: >-
          {{
            ansible_facts.apstra_facts.ip_pools
            | dict2items
            | selectattr('value.display_name', 'equalto', loopback_pool_name)
            | map(attribute='key')
            | first
            | default('')
          }}
      when: loopback_pool_name | length > 0

    - name: Find all loopback IP resource groups (leaf_loopback_ips)
      ansible.builtin.set_fact:
        loopback_resource_groups: >-
          {{ rg_response.json['items'] | selectattr('type', 'equalto', 'ip') | selectattr('name', 'search', 'leaf_loopback_ips') | list }}
      when: loopback_pool_name | length > 0

    - name: Debug - print loopback_pool_id and all matching resource groups
      debug:
        msg: "loopback_pool_name='{{ loopback_pool_name }}' loopback_pool_id='{{ loopback_pool_id | default('') }}' groups={{ loopback_resource_groups | map(attribute='name') | list }}"
      when: loopback_pool_name | length > 0

    - name: Assign loopback IP pool to all leaf_loopback_ips resource groups
      ansible.builtin.uri:
        url: "{{ lookup('env', 'APSTRA_API_URL') }}/blueprints/{{ register_bp.id.blueprint }}/resource_groups/ip/{{ item.name }}"
        method: PUT
        headers:
          AuthToken: "{{ auth.token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          pool_ids:
            - "{{ loopback_pool_id }}"
        validate_certs: false
        status_code: [200, 202, 204]
      loop: "{{ loopback_resource_groups }}"
      loop_control:
        label: "{{ item.name }}"
      when: loopback_pool_name | length > 0 and loopback_pool_id | length > 0
      register: loopback_assignment

    - name: Print loopback pool assignment result
      debug:
        msg: "Loopback pool '{{ loopback_pool_name }}' (id={{ loopback_pool_id }}) assigned to all leaf_loopback_ips resource groups: {{ loopback_resource_groups | map(attribute='name') | list }}"
      when: loopback_pool_name | length > 0 and loopback_pool_id | length > 0

    

    - name: If changes are made, print changed
      debug:
        msg: "{{ sz.changed }}"
      when: sz.changed

    - name: If changes are not made, print not changed
      debug:
        msg: "{{ sz }}"
      when: not sz.changed

  rescue:
    - name: Unlock the blueprint as task is failed
      juniper.apstra.blueprint:
        id: "{{ register_bp.id }}"
        lock_state: "unlocked"
        state: committed
        auth_token: "{{ auth.token }}"
      register: blueprint_commit

    - name: Update the label of project as failed
      k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ event.resource.metadata.name }}"
            labels:
              apstraStatus: "failed"

    - name: Remove the label of project as failed
      k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ event.resource.metadata.name }}"
            labels:
              type: NULL

  always:
    - name: Unlock the blueprint
      juniper.apstra.blueprint:
        id: "{{ register_bp.id }}"
        lock_state: "unlocked"
        state: committed
        auth_token: "{{ auth.token }}"
      register: blueprint_unlock

    - name: Commit the blueprint
      juniper.apstra.blueprint:
        id: "{{ register_bp.id }}"
        lock_state: "ignore"
        state: committed
        auth_token: "{{ auth.token }}"
      register: blueprint_commit

    - name: Update the label of project as Success
      k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ event.resource.metadata.name }}"
            labels:
              apstraStatus: "Success"
      when: not sz.failed
